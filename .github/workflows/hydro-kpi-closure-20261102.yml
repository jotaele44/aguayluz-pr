name: hydro-kpi-closure-20261102

on:
  push:
    branches:
      - ops/hydro-kpi-closure-20261102
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser
        run: python -m pip install --disable-pip-version-check openpyxl
      - name: Compile gate
        run: python -m py_compile scripts/ops_hydro_kpi_closure_20261102.py
      - name: Acquire and parse
        shell: bash
        run: |
          set -euo pipefail
          export HYDRO_KPI_OUT=hydro-kpi-closure
          python scripts/ops_hydro_kpi_closure_20261102.py | tee hydro-kpi-closure-console.json
          test -s hydro-kpi-closure/derived/summary.json
          test -s hydro-kpi-closure/derived/manifest.json
          test -s hydro-kpi-closure/derived/semantic_hits.jsonl
          test -s hydro-kpi-closure-console.json
      - name: Add workflow metadata
        if: always()
        run: |
          mkdir -p hydro-kpi-closure
          printf '%s\n' "${{ github.sha }}" > hydro-kpi-closure/workflow_commit_sha.txt
          printf '%s\n' "${{ github.run_id }}" > hydro-kpi-closure/workflow_run_id.txt
          printf '%s\n' "${{ github.run_attempt }}" > hydro-kpi-closure/workflow_run_attempt.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hydro-kpi-closure-20261102
          path: |
            hydro-kpi-closure/
            hydro-kpi-closure-console.json
          if-no-files-found: error
          retention-days: 30
