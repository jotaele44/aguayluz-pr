name: LUMA monthly generation adapter validation

on:
  push:
    branches:
      - feature/luma-monthly-generation-adapter
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: |
          python -m pip install --disable-pip-version-check pytest==9.2.0 ruff==0.17.3 pypdf==6.21.4

      - name: Compile
        run: |
          python -m py_compile scripts/luma_monthly_generation_adapter.py

      - name: Ruff
        run: |
          ruff check scripts/luma_monthly_generation_adapter.py tests/test_luma_monthly_generation_adapter.py

      - name: Targeted regression suite
        run: |
          pytest -q tests/test_luma_monthly_generation_adapter.py

      - name: CLI smoke
        run: |
          python scripts/luma_monthly_generation_adapter.py --help
          python scripts/luma_monthly_generation_adapter.py backfill --help
          python scripts/luma_monthly_generation_adapter.py incremental --help
          python scripts/luma_monthly_generation_adapter.py replay --help

      - name: Internal capability inventory parity
        run: python scripts/check_gui_parity.py

  gui-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install production backend runtime
        run: python -m pip install -r server/backend/requirements.txt
      - name: Install frontend dependencies
        working-directory: dashboard
        run: npm ci
      - name: Install browser
        working-directory: dashboard
        run: npx playwright install --with-deps chromium
      - name: Required GUI parity regression
        working-directory: dashboard
        run: npm run test:gui-parity

      - name: Upload GUI regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luma-adapter-gui-regression-${{ github.run_id }}
          path: |
            dashboard/playwright-report/gui-parity
            dashboard/test-results
          if-no-files-found: ignore
          retention-days: 14
