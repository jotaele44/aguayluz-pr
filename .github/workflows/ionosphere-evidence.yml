name: Ionosphere source acquisition evidence
on:
  pull_request:
    paths:
      - 'scripts/capture_ionosphere_evidence.py'
      - 'tests/test_capture_ionosphere_evidence.py'
      - '.github/workflows/ionosphere-evidence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Acquire source evidence (not certification)
        run: python scripts/capture_ionosphere_evidence.py artifacts/ionosphere-acquisition
      - name: Preserve raw responses and receipt even on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ionosphere-acquisition-${{ github.sha }}
          path: artifacts/ionosphere-acquisition
          if-no-files-found: error
          retention-days: 30
