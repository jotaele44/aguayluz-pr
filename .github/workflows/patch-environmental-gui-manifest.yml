name: One-shot environmental GUI manifest registration

on:
  push:
    branches:
      - feat/environmental-exposure-graph-max-v1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/environmental-exposure-graph-max-v1
      - name: Patch capability manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('.federation/gui-capabilities.json')
          doc = json.loads(path.read_text(encoding='utf-8'))
          api_root = 'dashboard/src/lib/environmental-exposure-api.js'
          roots = doc['discovery']['frontend_api_roots']
          if api_root not in roots:
              roots.append(api_root)

          capability = {
              'id': 'environmental-exposure-graph',
              'classification': 'analysis',
              'status': 'active',
              'requires_terminal': False,
              'rationale': (
                  'Read-only, fail-closed environmental source→pathway→receptor graph. '
                  'It preserves existing utility/regulatory identities, exposes provenance '
                  'and causal state, and prohibits proximity/name-only evidence from '
                  'becoming causal attribution.'
              ),
              'backend': {
                  'files': [
                      'server/backend/environmental_exposure_api.py',
                      'server/backend/app.py',
                      'src/aguayluz/environmental_exposure.py',
                      'src/aguayluz/environmental_exposure_db.py',
                  ],
                  'endpoints': [
                      'GET /environmental-exposure/summary',
                      'GET /environmental-exposure/entities',
                      'GET /environmental-exposure/entities/{entity_id}',
                      'GET /environmental-exposure/relationships',
                      'GET /environmental-exposure/integrity',
                  ],
                  'symbols': [
                      'server/backend/environmental_exposure_api.py:environmental_exposure_summary',
                      'server/backend/environmental_exposure_api.py:environmental_exposure_entities',
                      'server/backend/environmental_exposure_api.py:environmental_exposure_entity',
                      'server/backend/environmental_exposure_api.py:environmental_exposure_relationships',
                      'server/backend/environmental_exposure_api.py:environmental_exposure_integrity',
                      'src/aguayluz/environmental_exposure.py:stable_id',
                      'src/aguayluz/environmental_exposure.py:derive_entity_id',
                      'src/aguayluz/environmental_exposure.py:derive_relationship_id',
                      'src/aguayluz/environmental_exposure.py:validate_relationship',
                      'src/aguayluz/environmental_exposure.py:integrity_report',
                      'src/aguayluz/environmental_exposure_db.py:load',
                      'src/aguayluz/environmental_exposure_db.py:merge',
                      'src/aguayluz/environmental_exposure_db.py:write',
                      'src/aguayluz/environmental_exposure_db.py:graph_integrity',
                  ],
              },
              'frontend': {
                  'routes': ['/environmental-exposure'],
                  'e2e_routes': ['/environmental-exposure'],
                  'components': [
                      'dashboard/src/lib/environmental-exposure-api.js',
                      'dashboard/src/pages/EnvironmentalExposurePage.jsx',
                      'dashboard/src/components/layout/Sidebar.jsx',
                  ],
                  'discoverability': [
                      'dashboard/src/components/layout/Sidebar.jsx',
                  ],
              },
              'tests': {
                  'backend': ['tests/test_environmental_exposure_api.py'],
                  'contract': [
                      'tests/test_environmental_exposure.py',
                      'tests/test_gui_parity.py',
                  ],
                  'e2e': ['dashboard/tests/gui-parity.spec.mjs'],
              },
          }
          caps = doc['capabilities']
          caps[:] = [c for c in caps if c.get('id') != capability['id']]
          caps.append(capability)
          path.write_text(json.dumps(doc, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          # Round-trip validation before committing.
          json.loads(path.read_text(encoding='utf-8'))
          PY
      - name: Self-remove and commit
        run: |
          rm .github/workflows/patch-environmental-gui-manifest.yml
          git config user.name aguayluz-bot
          git config user.email noreply@github.com
          git add .federation/gui-capabilities.json .github/workflows/patch-environmental-gui-manifest.yml
          git diff --cached --check
          git commit -m 'chore: register environmental exposure GUI capability'
          git push origin HEAD:feat/environmental-exposure-graph-max-v1
