name: EPA SDWIS Hazard Source Freeze

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/ingest_sdwis_hazard_plane.py"
      - "scripts/ingest_sdwis_violations.py"
      - "src/aguayluz/hazard_adapters/epa_sdwis.py"
      - "src/aguayluz/water_alerts.py"
      - "config/hazard_advisory_sources.v1.json"
      - "tests/test_hazard_adapter_epa_sdwis.py"
      - "tests/test_ingest_sdwis_hazard_plane.py"
      - "tests/test_ingest_sdwis_violations.py"
      - "tests/test_water_alerts.py"
      - ".github/workflows/hazard-epa-sdwis-source.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: epa-sdwis-hazard-source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  freeze-2026-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install bounded runtime
        run: python -m pip install "httpx>=0.27" "pydantic>=2"

      - name: Freeze EPA SDWIS 2026 hazard denominator
        env:
          PYTHONPATH: src:.
        run: |
          python scripts/ingest_sdwis_hazard_plane.py \
            --year 2026 \
            --output-root artifacts/epa_sdwis_2026

      - name: Validate zero-residue bounded source receipt
        shell: python
        run: |
          import json
          from pathlib import Path

          path = Path("artifacts/epa_sdwis_2026/receipt.json")
          receipt = json.loads(path.read_text(encoding="utf-8"))
          arithmetic = receipt["source_arithmetic"]
          assert arithmetic["state"] == "PASS", arithmetic
          assert arithmetic["delta"] == 0, arithmetic
          assert arithmetic["unresolved"] == 0, arithmetic
          assert arithmetic["retained"] > 0, arithmetic
          assert receipt["certification_state"] == "PASS", receipt
          assert receipt["boil_water_inference_permitted"] is False, receipt
          assert (
              receipt["consumer_action_semantics"]
              == "UNRESOLVED_WITHOUT_EXPLICIT_PUBLIC_NOTICE"
          ), receipt
          assert receipt["pages_frozen"] > 0, receipt
          assert receipt["manifestations_frozen"] == receipt["pages_frozen"], receipt
          assert len(receipt["frozen_files"]) == receipt["manifestations_frozen"], receipt
          assert all(row["byte_sha256"] and row["raw_file"] for row in receipt["frozen_files"]), receipt
          print(json.dumps({
              "certification_state": receipt["certification_state"],
              "source_arithmetic": arithmetic,
              "pages_frozen": receipt["pages_frozen"],
              "manifestations_frozen": receipt["manifestations_frozen"],
              "new_record_revisions": receipt["new_record_revisions"],
              "consumer_action_semantics": receipt["consumer_action_semantics"],
          }, indent=2, sort_keys=True))

      - name: Upload EPA SDWIS source evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: epa-sdwis-hazard-source-freeze-2026
          path: artifacts/epa_sdwis_2026
          if-no-files-found: warn
          retention-days: 90
