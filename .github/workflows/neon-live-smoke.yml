name: NEON live smoke

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: neon-live-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.action == 'labeled' &&
       github.event.label.name == 'run-neon-smoke' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Fetch shared federation packages (thehub-pr sibling)
        run: git clone --depth 1 https://github.com/jotaele44/thehub-pr.git ../thehub-pr
      - name: Install runtime
        run: python -m pip install uv && uv pip install --system -e ".[dev]"
      - name: Bounded NEON-only live health smoke
        env:
          NEON_API_TOKEN: ${{ secrets.NEON_API_TOKEN }}
        run: python scripts/smoke_neon_live.py
