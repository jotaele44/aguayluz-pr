name: NEON live smoke

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: neon-live-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.action == 'labeled' &&
       github.event.label.name == 'run-neon-smoke' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Fetch shared federation packages (thehub-pr sibling)
        run: git clone --depth 1 https://github.com/jotaele44/thehub-pr.git ../thehub-pr
      - name: Install runtime
        run: python -m pip install uv && uv pip install --system -e ".[dev]"
      - name: Bounded NEON-only live health smoke
        env:
          NEON_API_TOKEN: ${{ secrets.NEON_API_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import httpx

          from aguayluz.neon.client import TOKEN_HEADER, USER_AGENT, resolve_token
          from aguayluz.neon.endpoints import DEFAULT_BASE_URL
          from aguayluz.neon.mapping import PR_DOMAIN_CODE, PR_SITE_CODES

          expected = {"CUPE", "GUAN", "GUIL", "LAJA"}
          token = resolve_token()
          if not token:
              raise SystemExit("FAIL: NEON_API_TOKEN is not configured")

          response = httpx.get(
              f"{DEFAULT_BASE_URL}/sites",
              headers={
                  "Accept": "application/json",
                  "User-Agent": USER_AGENT,
                  TOKEN_HEADER: token,
              },
              timeout=60.0,
          )
          if response.status_code != 200:
              raise SystemExit(f"FAIL: NEON /sites returned HTTP {response.status_code}")

          rows = (response.json().get("data") or [])
          observed = {
              str(row.get("siteCode"))
              for row in rows
              if isinstance(row, dict) and row.get("domainCode") == PR_DOMAIN_CODE
          }
          if PR_SITE_CODES != expected:
              raise SystemExit("FAIL: canonical Puerto Rico NEON registry changed")
          if observed != expected:
              raise SystemExit("FAIL: live Puerto Rico NEON denominator differs from canonical registry")

          print(json.dumps({
              "schema_version": "aguayluz.neon-live-smoke/v1",
              "provider": "neon",
              "status": "ok",
              "http_status": response.status_code,
              "authenticated": True,
              "site_codes": sorted(observed),
              "persisted": False,
              "notifications_enabled": False,
              "certified_series_promoted": False,
          }, sort_keys=True))
          PY
