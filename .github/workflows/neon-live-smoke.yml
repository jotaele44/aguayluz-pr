name: NEON live smoke

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: neon-live-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.action == 'labeled' &&
       github.event.label.name == 'run-neon-smoke' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Fetch shared federation packages (thehub-pr sibling)
        run: git clone --depth 1 https://github.com/jotaele44/thehub-pr.git ../thehub-pr
      - name: Install runtime
        run: python -m pip install uv && uv pip install --system -e ".[dev]"
      - name: Failure-classification regression gate
        run: |
          python - <<'PY'
          import httpx

          from aguayluz.neon.errors import (
              NeonAccessDenied,
              NeonAuthError,
              NeonRateLimitExceeded,
              NeonServerError,
          )

          SHARED_STATES = {
              "AUTH_ABSENT",
              "AUTH_REJECTED",
              "ACCESS_DENIED",
              "RATE_LIMIT",
              "NETWORK",
              "BAD_RESPONSE",
              "DENOMINATOR_MISMATCH",
          }
          NEON_TO_SHARED = {
              "SECRET_ABSENT": "AUTH_ABSENT",
              "CREDENTIAL_REJECTED": "AUTH_REJECTED",
              "ACCESS_DENIED": "ACCESS_DENIED",
              "RATE_LIMIT": "RATE_LIMIT",
              "NETWORK_FAILURE": "NETWORK",
              "BAD_RESPONSE": "BAD_RESPONSE",
              "SITE_DENOMINATOR_MISMATCH": "DENOMINATOR_MISMATCH",
          }

          def classify_neon(exc):
              if isinstance(exc, NeonAuthError):
                  return "CREDENTIAL_REJECTED"
              if isinstance(exc, NeonAccessDenied):
                  return "ACCESS_DENIED"
              if isinstance(exc, NeonRateLimitExceeded):
                  return "RATE_LIMIT"
              if isinstance(exc, (httpx.TimeoutException, httpx.NetworkError, httpx.TransportError)):
                  return "NETWORK_FAILURE"
              if isinstance(exc, (NeonServerError, httpx.HTTPStatusError, ValueError, TypeError, KeyError)):
                  return "BAD_RESPONSE"
              return "BAD_RESPONSE"

          request = httpx.Request("GET", "https://example.invalid")
          response = httpx.Response(418, request=request)
          cases = [
              (NeonAuthError("sentinel-body-must-not-be-emitted"), "CREDENTIAL_REJECTED", "AUTH_REJECTED"),
              (NeonAccessDenied("sentinel-body-must-not-be-emitted"), "ACCESS_DENIED", "ACCESS_DENIED"),
              (NeonRateLimitExceeded("sentinel-body-must-not-be-emitted", attempts=4), "RATE_LIMIT", "RATE_LIMIT"),
              (httpx.ConnectError("sentinel-body-must-not-be-emitted", request=request), "NETWORK_FAILURE", "NETWORK"),
              (NeonServerError("sentinel-body-must-not-be-emitted", status_code=503, body="secret-like-body"), "BAD_RESPONSE", "BAD_RESPONSE"),
              (httpx.HTTPStatusError("sentinel-body-must-not-be-emitted", request=request, response=response), "BAD_RESPONSE", "BAD_RESPONSE"),
              (ValueError("sentinel-body-must-not-be-emitted"), "BAD_RESPONSE", "BAD_RESPONSE"),
          ]
          for exc, expected_neon, expected_shared in cases:
              observed_neon = classify_neon(exc)
              observed_shared = NEON_TO_SHARED[observed_neon]
              if observed_neon != expected_neon or observed_shared != expected_shared:
                  raise SystemExit("FAIL: provider failure-state regression")
          if set(NEON_TO_SHARED.values()) != SHARED_STATES:
              raise SystemExit("FAIL: shared failure-state denominator mismatch")
          print("Provider failure-state regression: PASS")
          PY
      - name: Bounded NEON-only live health smoke
        env:
          NEON_API_TOKEN: ${{ secrets.NEON_API_TOKEN }}
        run: |
          python - <<'PY'
          import json

          import httpx

          from aguayluz.neon.client import NeonClient, resolve_token
          from aguayluz.neon.endpoints import SITES
          from aguayluz.neon.errors import (
              NeonAccessDenied,
              NeonAuthError,
              NeonRateLimitExceeded,
              NeonServerError,
          )
          from aguayluz.neon.mapping import PR_DOMAIN_CODE, PR_SITE_CODES

          EXPECTED = {"CUPE", "GUAN", "GUIL", "LAJA"}
          NEON_TO_SHARED = {
              "SECRET_ABSENT": "AUTH_ABSENT",
              "CREDENTIAL_REJECTED": "AUTH_REJECTED",
              "ACCESS_DENIED": "ACCESS_DENIED",
              "RATE_LIMIT": "RATE_LIMIT",
              "NETWORK_FAILURE": "NETWORK",
              "BAD_RESPONSE": "BAD_RESPONSE",
              "SITE_DENOMINATOR_MISMATCH": "DENOMINATOR_MISMATCH",
          }

          def emit_failure(failure_class):
              print(json.dumps({
                  "schema_version": "aguayluz.neon-live-smoke/v3",
                  "provider": "neon",
                  "status": "blocked",
                  "failure_class": failure_class,
                  "shared_failure_state": NEON_TO_SHARED[failure_class],
                  "persisted": False,
                  "notifications_enabled": False,
                  "certified_series_promoted": False,
              }, sort_keys=True))
              raise SystemExit(1)

          token = resolve_token()
          if not token:
              emit_failure("SECRET_ABSENT")

          try:
              with NeonClient(token=token, max_retries=0) as client:
                  payload = client.get(SITES)
          except NeonAuthError:
              emit_failure("CREDENTIAL_REJECTED")
          except NeonAccessDenied:
              emit_failure("ACCESS_DENIED")
          except NeonRateLimitExceeded:
              emit_failure("RATE_LIMIT")
          except (httpx.TimeoutException, httpx.NetworkError, httpx.TransportError):
              emit_failure("NETWORK_FAILURE")
          except (NeonServerError, httpx.HTTPStatusError, ValueError, TypeError, KeyError):
              emit_failure("BAD_RESPONSE")

          try:
              rows = payload.get("data") or []
              if not isinstance(rows, list):
                  emit_failure("BAD_RESPONSE")
              observed = {
                  str(row.get("siteCode"))
                  for row in rows
                  if isinstance(row, dict) and row.get("domainCode") == PR_DOMAIN_CODE
              }
          except (AttributeError, TypeError, ValueError):
              emit_failure("BAD_RESPONSE")

          if PR_SITE_CODES != EXPECTED or observed != EXPECTED:
              emit_failure("SITE_DENOMINATOR_MISMATCH")

          print(json.dumps({
              "schema_version": "aguayluz.neon-live-smoke/v3",
              "provider": "neon",
              "status": "ok",
              "http_status": 200,
              "authenticated": True,
              "site_codes": sorted(observed),
              "persisted": False,
              "notifications_enabled": False,
              "certified_series_promoted": False,
          }, sort_keys=True))
          PY
