name: AguaYLuz recovery successor v1 — source health and protected mutations
on:
  push:
    branches: [recovery/floot-baseline-2026-09-30]
    paths:
      - ".recovery/aguayluz-successor-v1/**"
      - ".github/workflows/recovery-aguayluz-successor-v1.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  successor-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - name: Reproduce exact 134-test baseline
        shell: bash
        run: bash .recovery/aguayluz-exact/run_exact.sh
      - name: Apply successor v1
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/recovered"
          cp .recovery/aguayluz-successor-v1/aguaSourceHealth.tsx "$ROOT/helpers/aguaSourceHealth.tsx"
          cp .recovery/aguayluz-successor-v1/aguaSourceHealth.spec.tsx "$ROOT/helpers/aguaSourceHealth.spec.tsx"
          cp .recovery/aguayluz-successor-v1/aguaWaterMutationGuard.tsx "$ROOT/helpers/aguaWaterMutationGuard.tsx"
          cp .recovery/aguayluz-successor-v1/aguaWaterMutationGuard.spec.tsx "$ROOT/helpers/aguaWaterMutationGuard.spec.tsx"
          cd "$ROOT"
          sha256sum helpers/aguaSourceHealth.tsx helpers/aguaSourceHealth.spec.tsx helpers/aguaWaterMutationGuard.tsx helpers/aguaWaterMutationGuard.spec.tsx > successor-v1-overlay-hashes.txt
      - name: Execute successor v1 regression
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/recovered"
          mapfile -t exec_specs < <(awk -F '\t' '$2=="EXECUTABLE"{print $1}' recovery-spec-classification.tsv)
          exec_specs+=(helpers/aguaSourceHealth.spec.tsx helpers/aguaWaterMutationGuard.spec.tsx)
          set +e
          npx vitest run --config recovery.vitest.config.mts --reporter=verbose "${exec_specs[@]}" 2>&1 | tee successor-v1-vitest.log
          status=${PIPESTATUS[0]}
          set -e
          echo "$status" > successor-v1-test-exit.txt
          test "$status" = "0"
          grep -q "152 passed" successor-v1-vitest.log
      - name: Production build
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/recovered"
          set +e
          npx vite build 2>&1 | tee successor-v1-build.log
          status=${PIPESTATUS[0]}
          set -e
          echo "$status" > successor-v1-build-exit.txt
          test "$status" = "0"
      - name: Freeze successor v1 receipt
        shell: bash
        run: |
          cd "$RUNNER_TEMP/recovered"
          {
            echo "schema=aguayluz-recovery-successor/v1"
            echo "baseline_tests=134"
            echo "successor_v1_tests=152"
            echo "source_health=EMPTY_STALE_ERROR_DISTINCT"
            echo "historical_to_current_substitution=DENY"
            echo "current_condition=ALL_REQUIRED_METRICS_CURRENT"
            echo "protected_mutations=AUTH_ROLE_IDEMPOTENCY_REQUIRED"
            echo "alert_publish_retract=ADMIN_ONLY"
            echo "state=PASS"
          } > successor-v1-receipt.txt
          sha256sum package-lock.json successor-v1-overlay-hashes.txt successor-v1-vitest.log successor-v1-build.log successor-v1-receipt.txt > successor-v1-evidence-hashes.txt
      - name: Upload successor v1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aguayluz-recovery-successor-v1
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/recovered/package-lock.json
            ${{ runner.temp }}/recovered/successor-v1-overlay-hashes.txt
            ${{ runner.temp }}/recovered/successor-v1-vitest.log
            ${{ runner.temp }}/recovered/successor-v1-test-exit.txt
            ${{ runner.temp }}/recovered/successor-v1-build.log
            ${{ runner.temp }}/recovered/successor-v1-build-exit.txt
            ${{ runner.temp }}/recovered/successor-v1-receipt.txt
            ${{ runner.temp }}/recovered/successor-v1-evidence-hashes.txt
