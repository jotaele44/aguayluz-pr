name: EIA-860M Reference Certification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify-eia860m-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install project
        run: python -m pip install -e .

      - name: Acquire and certify real EIA-860M Jan/Feb bytes
        run: python scripts/certify_eia860m_reference.py --output artifacts/eia860m-reference

      - name: Upload immutable reference evidence bundle
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: eia860m-reference-evidence
          path: artifacts/eia860m-reference
          if-no-files-found: error
          retention-days: 90
