name: recover-patillas-tablx-once

on:
  push:
    branches:
      - agent/shared-resource-balance-core-v0-1
    paths:
      - .github/workflows/recover-patillas-tablx-once.yml

permissions:
  actions: read
  contents: write

jobs:
  recover:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/shared-resource-balance-core-v0-1
          fetch-depth: 1

      - name: Recover exact FileGDB component from verified artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_id=8912513566
          artifact_zip="$RUNNER_TEMP/patillas-authoritative.zip"
          work="$RUNNER_TEMP/patillas-authoritative"
          dest="research/resource_balance/pilots/patillas_guayama_v0_4_1/source/Patillas_Terrain_2019.gdb/a00000064.gdbtablx"
          curl --fail --location --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
            --output "$artifact_zip"
          mkdir -p "$work"
          unzip -q "$artifact_zip" -d "$work"
          src="$work/extracted/Patillas_Terrain_2019.gdb/a00000064.gdbtablx"
          test -f "$src"
          python - "$src" <<'PY'
          import hashlib
          import pathlib
          import sys
          p = pathlib.Path(sys.argv[1])
          data = p.read_bytes()
          assert len(data) == 5152, len(data)
          assert hashlib.sha256(data).hexdigest() == "a0e2a5535d04bdcd7ab71c2b593a4b4f3d1a859db4812aa22b7dd66c0826c1da"
          PY
          cp "$src" "$dest"
          python - "$dest" <<'PY'
          import hashlib
          import pathlib
          import sys
          p = pathlib.Path(sys.argv[1])
          data = p.read_bytes()
          assert len(data) == 5152, len(data)
          assert hashlib.sha256(data).hexdigest() == "a0e2a5535d04bdcd7ab71c2b593a4b4f3d1a859db4812aa22b7dd66c0826c1da"
          PY

      - name: Commit exact bytes and remove recovery workflow
        run: |
          set -euo pipefail
          dest="research/resource_balance/pilots/patillas_guayama_v0_4_1/source/Patillas_Terrain_2019.gdb/a00000064.gdbtablx"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$dest"
          git rm .github/workflows/recover-patillas-tablx-once.yml
          changed="$(git diff --cached --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = $'.github/workflows/recover-patillas-tablx-once.yml\nresearch/resource_balance/pilots/patillas_guayama_v0_4_1/source/Patillas_Terrain_2019.gdb/a00000064.gdbtablx'
          git commit -m "Repair Patillas FileGDB tablx from verified artifact"
          git push origin HEAD:agent/shared-resource-balance-core-v0-1
