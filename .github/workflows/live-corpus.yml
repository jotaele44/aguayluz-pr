name: live-corpus

# Hits live EPA WATERS + FRS + FEMA APIs. Two trigger modes:
#   - workflow_dispatch: operator-initiated. Inputs are operator-supplied.
#   - schedule (daily): the M23 automated drift detector. Uses default inputs
#     and forces baseline_check=true so unexpected changes fail loudly.
# Repo secret `EPA_WATERS_API_KEY` must be set for --use-waters runs.
# Optional repo secret `SLACK_WEBHOOK_URL` enables drift notifications.
# All operator-supplied inputs flow through env: blocks (never inline-
# interpolated into run: commands) to keep them out of the shell-injection path.
on:
  workflow_dispatch:
    inputs:
      cities:
        description: PR cities for the FRS live pull (comma-separated)
        required: false
        default: BAYAMON,SAN_JUAN,PONCE,CAGUAS,MAYAGUEZ
      damage_codes:
        description: FEMA damage codes (D=Water Control, F=Utilities)
        required: false
        default: D,F
      max_fema_records:
        description: Cap for FEMA pagination
        required: false
        default: '50'
      baseline_write:
        description: Write tests/baseline/live_corpus_summary.json
        required: false
        default: 'false'
      baseline_check:
        description: Compare run against committed baseline
        required: false
        default: 'true'
  schedule:
    # Daily at 12:00 UTC (08:00 AST). M23 automated drift detector.
    - cron: '0 12 * * *'

jobs:
  live-corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .[dev]
      - name: Run full chain (live)
        id: chain
        env:
          EPA_WATERS_API_KEY: ${{ secrets.EPA_WATERS_API_KEY }}
          CITIES: ${{ inputs.cities || 'BAYAMON,SAN_JUAN,PONCE,CAGUAS,MAYAGUEZ' }}
          DAMAGE_CODES: ${{ inputs.damage_codes || 'D,F' }}
          MAX_FEMA_RECORDS: ${{ inputs.max_fema_records || '50' }}
          BASELINE_WRITE: ${{ inputs.baseline_write || 'false' }}
          BASELINE_CHECK: ${{ inputs.baseline_check || 'true' }}
        run: |
          ARGS=(--live --use-waters --cities "$CITIES" --damage-codes "$DAMAGE_CODES" --max-fema-records "$MAX_FEMA_RECORDS")
          if [ "$BASELINE_WRITE" = "true" ]; then
            ARGS+=(--baseline-write)
          fi
          if [ "$BASELINE_CHECK" = "true" ]; then
            ARGS+=(--baseline-check)
          fi
          python scripts/run_full_chain.py "${ARGS[@]}"
      - name: Notify Slack on drift
        if: failure() && steps.chain.outcome == 'failure'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TRIGGER: ${{ github.event_name }}
        run: |
          python scripts/notify_drift.py \
            --title "live-corpus baseline drift" \
            --severity critical \
            --body "Trigger: $TRIGGER. The full-chain run against EPA FRS + FEMA + WATERS failed baseline check or live ingest. Run: $RUN_URL"
      - name: Upload outputs artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-corpus-outputs
          path: outputs/
          if-no-files-found: warn
