name: desktop-build

on:
  workflow_dispatch:
  push:
    tags: ["desktop-v*"]
  pull_request:
    branches: [main]
    paths:
      - "desktop/**"
      - "assets/branding/**"
      - "dashboard/**"
      - "server/backend/**"
      - "scripts/federation_export.py"
      - "src/aguayluz/**"
      - "schemas/**"
      - "config/**"
      - "requirements-desktop.txt"
      - ".github/workflows/desktop-build.yml"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PRII_TOOLING_REF: f2b81769924689b4d959554928810b1d7b7ef3d6
      PRII_FORBIDDEN_SIBLING: thehub-pr
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Enforce isolated desktop-build policy
        shell: bash
        run: |
          test ! -e "$GITHUB_WORKSPACE/../$PRII_FORBIDDEN_SIBLING"
          python - <<'PY'
          from pathlib import Path
          needles = (
              "../" + "thehub-pr",
              "ensure_" + "hub_sibling",
              "HUB_" + "CLONE_URL",
              "HUB_" + "SIBLING",
              "REPO_ROOT.parent / " + '"thehub-pr"',
          )
          violations = []
          for path in Path(".").rglob("*"):
              if not path.is_file():
                  continue
              rel = path.as_posix()
              if rel.startswith((".git/", ".venv/", "node_modules/", "dist/", "build/")):
                  continue
              executable = rel == ".github/workflows/desktop-build.yml"
              executable = executable or rel.startswith(("desktop/", "scripts/", "tools/"))
              executable = executable or path.name.startswith("requirements")
              executable = executable or path.name in {"pyproject.toml", "Makefile"}
              if not executable:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              for needle in needles:
                  if needle in text:
                      violations.append(f"{rel}: {needle}")
          if violations:
              raise SystemExit("mandatory sibling coupling found:\n" + "\n".join(violations))
          PY

      - name: Fetch pinned federation tooling outside workspace
        shell: bash
        run: |
          tooling_root="$RUNNER_TEMP/prii-thehub-tooling"
          rm -rf "$tooling_root"
          git clone --filter=blob:none --no-checkout https://github.com/jotaele44/thehub-pr.git "$tooling_root"
          git -C "$tooling_root" checkout --detach "$PRII_TOOLING_REF"
          test "$(git -C "$tooling_root" rev-parse HEAD)" = "$PRII_TOOLING_REF"
          echo "PRII_TOOLING_ROOT=$tooling_root" >> "$GITHUB_ENV"
          test ! -e "$GITHUB_WORKSPACE/../$PRII_FORBIDDEN_SIBLING"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"

      - name: Build frontend
        working-directory: dashboard
        env:
          VITE_API_BASE: ""
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Install Python dependencies
        shell: bash
        run: |
          test ! -e "$GITHUB_WORKSPACE/../$PRII_FORBIDDEN_SIBLING"
          python -m pip install --upgrade pip
          pip install -r server/backend/requirements.txt -r requirements-desktop.txt -r "$PRII_TOOLING_ROOT/tools/requirements-icons.txt" pyinstaller pytest httpx
          test ! -e "$GITHUB_WORKSPACE/../$PRII_FORBIDDEN_SIBLING"

      - name: Verify artwork and shared runtime
        shell: bash
        run: |
          python "$PRII_TOOLING_ROOT/tools/build_program_icons.py" --repo . --check
          python "$PRII_TOOLING_ROOT/tools/validate_desktop_branding.py" --repo .
          python -m pytest "$PRII_TOOLING_ROOT/packages/prii_desktop/tests" -q

      - name: Visual and accessibility smoke
        if: runner.os == 'Linux'
        shell: bash
        env:
          PRII_REPO_SLUG: aguayluz-pr
          PRII_SETUP_FIXTURE: ${{ github.workspace }}/desktop-ui-artifacts/setup.html
          PRII_VISUAL_DIR: ${{ github.workspace }}/desktop-ui-artifacts
        run: |
          python "$PRII_TOOLING_ROOT/tools/render_desktop_setup.py" --repo . --output desktop-ui-artifacts/setup.html
          cd "$PRII_TOOLING_ROOT/federation-design/test-harness"
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npx playwright test tests/desktop-setup.spec.js --project=tablet-768 --project=desktop-1280

      - name: Upload native setup visual evidence
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aguayluz-pr-native-setup-visuals
          path: desktop-ui-artifacts/*.png
          if-no-files-found: warn
          retention-days: 30

      - name: Freeze console build
        env:
          PRII_CONSOLE: "1"
        run: pyinstaller desktop/pyinstaller.spec --distpath dist-smoke --noconfirm

      - name: Smoke test frozen app
        shell: python
        run: |
          import pathlib, subprocess, sys
          name = "PRII-AGUAYLUZ"
          exe = pathlib.Path("dist-smoke") / name / (name + (".exe" if sys.platform == "win32" else ""))
          sys.exit(subprocess.run([str(exe), "--smoke"], timeout=120).returncode)

      - name: Freeze desktop app
        run: pyinstaller desktop/pyinstaller.spec --distpath dist-desktop --noconfirm

      - name: Package bundle
        shell: bash
        run: |
          cd dist-desktop
          if [ "$RUNNER_OS" = "macOS" ] && [ -d "PRII-AGUAYLUZ.app" ]; then
            zip -qry "PRII-AGUAYLUZ-${RUNNER_OS}.zip" "PRII-AGUAYLUZ.app"
          else
            7z a -bd "PRII-AGUAYLUZ-${RUNNER_OS}.zip" "PRII-AGUAYLUZ" > /dev/null
          fi

      - name: Package .dmg
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd dist-desktop
          staging="dmg-staging"
          rm -rf "$staging" && mkdir "$staging"
          cp -R "PRII-AGUAYLUZ.app" "$staging/"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname "PRII-AGUAYLUZ" -srcfolder "$staging" -ov -format UDZO "PRII-AGUAYLUZ-macOS.dmg"
          rm -rf "$staging"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: PRII-AGUAYLUZ-${{ runner.os }}
          path: |
            dist-desktop/PRII-AGUAYLUZ-*.zip
            dist-desktop/PRII-AGUAYLUZ-*.dmg

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: |
            dist-desktop/PRII-AGUAYLUZ-*.zip
            dist-desktop/PRII-AGUAYLUZ-*.dmg
