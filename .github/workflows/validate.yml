name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Assert isolated checkout
        run: test ! -e "$GITHUB_WORKSPACE/../thehub-pr"
      - name: Install uv
        run: python -m pip install uv
      - name: Install
        run: uv pip install --system -e .[dev] -r server/backend/requirements.txt
      - name: Federation manifest gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("federation.json").read_text())
          required = {
              "schema_version", "program_id", "repository_full_name",
              "federation_role", "hub_parent", "hub_callable_commands",
              "canonical_outputs", "federation_readiness_gate",
          }
          missing = sorted(required - set(manifest))
          assert not missing, f"federation.json missing required keys: {missing}"
          assert manifest["schema_version"] == "repo_federation_manifest_v1"
          assert manifest["program_id"] == "aguayluz-pr"
          assert manifest["hub_parent"] == "thehub-pr"
          assert "setup" in manifest["hub_callable_commands"]
          assert "test_suite" in manifest["hub_callable_commands"]
          gate = manifest["federation_readiness_gate"]
          assert isinstance(gate.get("ready_for_hub_discovery"), bool)
          assert isinstance(gate.get("ready_for_hub_live_execution"), bool)
          assert isinstance(gate.get("blocking_conditions"), list)
          print("federation manifest gate passed")
          PY
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q --cov --cov-report=term-missing:skip-covered
      - name: Validation gates
        run: python scripts/validate_repo.py
      - name: Reassert isolated checkout
        run: test ! -e "$GITHUB_WORKSPACE/../thehub-pr"

  geo-import-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Assert isolated checkout
        run: test ! -e "$GITHUB_WORKSPACE/../thehub-pr"
      - name: Install uv
        run: python -m pip install uv
      - name: Install with geo extra
        run: uv pip install --system -e .[geo]
      - name: Import-check geo boundary builder
        run: python scripts/build_pr_geo_boundaries.py --help

  dashboard-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm run test
      - name: Build
        run: npm run build

  live-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Assert isolated checkout
        run: test ! -e "$GITHUB_WORKSPACE/../thehub-pr"
      - name: Install uv
        run: python -m pip install uv
      - run: uv pip install --system -e .[dev]
      - name: Live smoke
        env:
          EPA_WATERS_API_KEY: ${{ secrets.EPA_WATERS_API_KEY }}
        run: python scripts/smoke_test.py

  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Assert isolated checkout
        run: test ! -e "$GITHUB_WORKSPACE/../thehub-pr"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
      - name: Lock file is canonical
        run: |
          uv lock
          git diff --exit-code -- uv.lock

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Assert isolated checkout
        run: test ! -e "$GITHUB_WORKSPACE/../thehub-pr"
      - name: Install
        run: |
          python -m pip install uv
          uv pip install --system -e .[dev] mypy
      - name: Mypy (report-only)
        continue-on-error: true
        run: python -m mypy
