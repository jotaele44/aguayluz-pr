name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: this workflow only reads the repo (and uploads artifacts,
# which uses the runtime token, not GITHUB_TOKEN). Widen deliberately if a
# step ever needs to write back.
permissions:
  contents: read

# Supersede older runs of this workflow on the same ref: a newer push
# makes the in-flight result irrelevant, so cancel it and free the runner.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Fetch shared federation packages (thehub-pr sibling)
        run: |
          ref="${{ github.head_ref || github.ref_name }}"
          git clone --depth 1 --branch "$ref" https://github.com/jotaele44/thehub-pr.git ../thehub-pr \
            || git clone --depth 1 https://github.com/jotaele44/thehub-pr.git ../thehub-pr
      - name: Install uv
        run: python -m pip install uv
      - name: Install
        run: uv pip install --system -e .[dev] -r server/backend/requirements.txt
      - name: Federation manifest gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("federation.json").read_text())
          required = {
              "schema_version",
              "program_id",
              "repository_full_name",
              "federation_role",
              "hub_parent",
              "hub_callable_commands",
              "canonical_outputs",
              "federation_readiness_gate",
          }
          missing = sorted(required - set(manifest))
          assert not missing, f"federation.json missing required keys: {missing}"
          assert manifest["schema_version"] == "repo_federation_manifest_v1"
          assert manifest["program_id"] == "aguayluz-pr"
          assert manifest["hub_parent"] == "thehub-pr"
          assert "setup" in manifest["hub_callable_commands"]
          assert "test_suite" in manifest["hub_callable_commands"]
          gate = manifest["federation_readiness_gate"]
          assert isinstance(gate.get("ready_for_hub_discovery"), bool)
          assert isinstance(gate.get("ready_for_hub_live_execution"), bool)
          assert isinstance(gate.get("blocking_conditions"), list)
          print("federation manifest gate passed")
          PY
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q --cov --cov-report=term-missing:skip-covered
      - name: Validation gates
        run: python scripts/validate_repo.py

  geo-import-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Fetch shared federation packages (thehub-pr sibling)
        run: |
          ref="${{ github.head_ref || github.ref_name }}"
          git clone --depth 1 --branch "$ref" https://github.com/jotaele44/thehub-pr.git ../thehub-pr \
            || git clone --depth 1 https://github.com/jotaele44/thehub-pr.git ../thehub-pr
      - name: Install uv
        run: python -m pip install uv
      - name: Install with geo extra
        run: uv pip install --system -e .[geo]
      - name: Import-check geo boundary builder
        run: python scripts/build_pr_geo_boundaries.py --help

  dashboard-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  live-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Fetch shared federation packages (thehub-pr sibling)
        run: |
          ref="${{ github.head_ref || github.ref_name }}"
          git clone --depth 1 --branch "$ref" https://github.com/jotaele44/thehub-pr.git ../thehub-pr \
            || git clone --depth 1 https://github.com/jotaele44/thehub-pr.git ../thehub-pr
      - name: Install uv
        run: python -m pip install uv
      - run: uv pip install --system -e .[dev]
      - name: Bounded NEON-only live health smoke
        env:
          NEON_API_TOKEN: ${{ secrets.NEON_API_TOKEN }}
        run: python scripts/smoke_neon_provider.py

  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Fetch shared federation packages (thehub-pr sibling)
        run: |
          ref="${{ github.head_ref || github.ref_name }}"
          git clone --depth 1 --branch "$ref" https://github.com/jotaele44/thehub-pr.git ../thehub-pr \
            || git clone --depth 1 https://github.com/jotaele44/thehub-pr.git ../thehub-pr
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Lock file is up to date
        run: uv lock --check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Fetch shared federation packages (thehub-pr sibling)
        run: |
          ref="${{ github.head_ref || github.ref_name }}"
          git clone --depth 1 --branch "$ref" https://github.com/jotaele44/thehub-pr.git ../thehub-pr \
            || git clone --depth 1 https://github.com/jotaele44/thehub-pr.git ../thehub-pr
      - name: Install
        run: |
          python -m pip install uv
          uv pip install --system -e .[dev] mypy
      - name: Mypy (report-only)
        continue-on-error: true
        run: python -m mypy
