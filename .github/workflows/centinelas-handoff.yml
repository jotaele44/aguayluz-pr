name: Centinelas handoff intake
on:
  repository_dispatch:
    types: [centinelas-handoff]
permissions:
  contents: write
  statuses: write   # record the docs-sync verdict on the commit it pushes to main
# One group per handoff, not per ref. With a single group GitHub keeps only one
# pending run and cancels the rest, and a cancelled run's payload exists nowhere
# else, so a burst of dispatches silently lost all but two. Distinct handoffs now
# run in parallel and serialise at the push below; redeliveries of the same
# handoff still queue behind each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.client_payload.idempotency_key || github.run_id }}
  cancel-in-progress: false

jobs:
  intake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # push_to_main.sh replays the data commit onto the current main and only
          # needs that commit's parent, which is the checkout itself.
          fetch-depth: 1
      - id: ingest
        env:
          CENTINELAS_CLIENT_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          EXPECTED_TARGET: aguayluz-pr
        run: python3 scripts/ingest_centinelas_handoff.py
      - name: Persist receipt + promoted record
        env:
          GH_TOKEN: ${{ github.token }}
          CENTINELAS_CLIENT_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          EXPECTED_TARGET: aguayluz-pr
        run: |
          git config user.name centinelas-handoff-bot
          git config user.email actions@users.noreply.github.com
          # Environmental signals write service_events; access-condition handoffs
          # write access_conditions. The receipt is committed atomically with either.
          # Add only the paths this handoff produced. A failed add or push fails the
          # job visibly instead of reporting a handoff that was never persisted.
          stage() {
            for path in data/centinelas_handoffs data/service_events.jsonl data/access_conditions.jsonl; do
              if [ -e "$path" ]; then git add -- "$path"; fi
            done
          }
          stage
          if git diff --cached --quiet -- data/centinelas_handoffs; then
            if [ "${{ steps.ingest.outputs.duplicate }}" != "true" ]; then
              echo "::error::no new handoff receipt was staged for a non-duplicate handoff"
              exit 1
            fi
          fi
          git diff --cached --quiet || git commit -m "data: ingest Centinelas handoff [skip ci]"
          # Push through scripts/push_to_main.sh: it replays the commit over whatever
          # landed on main meanwhile (the 15-minute refresh commits), runs docs-sync on
          # it and records the verdict as the `docs-sync` commit status a required check
          # on main expects. It exits 0 when there is nothing to push (a duplicate
          # handoff) and fails the job, visibly, if the commit cannot be pushed.
          #
          # Its replay is a cherry-pick, which conflicts when another handoff
          # rewrote access_conditions.jsonl in the meantime. On failure, start
          # again from the new main: re-run the idempotent ingest there, commit,
          # and push that commit instead (push_to_main.sh expects HEAD to be one
          # commit on top of GITHUB_SHA, so GITHUB_SHA moves with the reset).
          for round in 1 2 3; do
            if scripts/push_to_main.sh centinelas-handoff; then exit 0; fi
            echo "Push round $round failed; re-applying the handoff on the current main."
            git fetch --quiet origin "${GITHUB_REF_NAME:-main}"
            git checkout --quiet --detach FETCH_HEAD
            export GITHUB_SHA="$(git rev-parse HEAD)"
            python3 scripts/ingest_centinelas_handoff.py
            stage
            git diff --cached --quiet || git commit -m "data: ingest Centinelas handoff [skip ci]"
          done
          echo "::error::could not push the handoff receipt"
          exit 1
