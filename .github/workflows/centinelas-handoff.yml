name: Centinelas handoff intake
on:
  repository_dispatch:
    types: [centinelas-handoff]
permissions:
  contents: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  intake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Enough history to rebase over the 15-minute refresh commits that can
          # land on main while this job runs.
          fetch-depth: 50
      - id: ingest
        env:
          CENTINELAS_CLIENT_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          EXPECTED_TARGET: aguayluz-pr
        run: python3 scripts/ingest_centinelas_handoff.py
      - name: Persist receipt + promoted record
        run: |
          git config user.name centinelas-handoff-bot
          git config user.email actions@users.noreply.github.com
          # Environmental signals write service_events; access-condition handoffs
          # write access_conditions. The receipt is committed atomically with either.
          # Add only the paths this handoff produced. A failed add or push fails the
          # job, so the Acknowledge step below never runs for a receipt that was not
          # persisted on main.
          for path in data/centinelas_handoffs data/service_events.jsonl data/access_conditions.jsonl; do
            if [ -e "$path" ]; then git add -- "$path"; fi
          done
          if git diff --cached --quiet -- data/centinelas_handoffs; then
            if [ "${{ steps.ingest.outputs.duplicate }}" != "true" ]; then
              echo "::error::no new handoff receipt was staged for a non-duplicate handoff"
              exit 1
            fi
          fi
          git diff --cached --quiet || git commit -m "data: ingest Centinelas handoff [skip ci]"
          branch="${{ github.event.repository.default_branch }}"
          for attempt in 1 2 3 4; do
            if git push origin "HEAD:$branch"; then exit 0; fi
            sleep $((2 ** attempt))
            git pull --rebase origin "$branch"
          done
          echo "::error::could not push the handoff receipt; not acknowledging"
          exit 1
      - name: Acknowledge
        env:
          TOKEN: ${{ secrets.FEDERATION_DISPATCH_TOKEN }}
          KEY: ${{ github.event.client_payload.idempotency_key }}
          ITEM: ${{ github.event.client_payload.item_id }}
          DUPLICATE: ${{ steps.ingest.outputs.duplicate }}
        run: |
          test -n "$TOKEN"
          body=$(jq -nc --arg item "$ITEM" --arg key "$KEY" --argjson duplicate "$DUPLICATE" \
            '{event_type:"centinelas-handoff-ack",client_payload:{item_id:$item,target:"aguayluz-pr",idempotency_key:$key,status:"acknowledged",duplicate:$duplicate}}')
          curl -sSf -X POST -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/jotaele44/centinelas-pr/dispatches \
            -d "$body"
