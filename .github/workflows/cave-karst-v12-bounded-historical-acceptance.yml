name: Cave Karst v1.2 bounded historical live acceptance

on:
  push:
    branches: ["agent/cave-karst-consolidation-v1-2"]
    paths: [".github/workflows/cave-karst-v12-bounded-historical-acceptance.yml"]
  pull_request:
    branches: [main]
    paths: [".github/workflows/cave-karst-v12-bounded-historical-acceptance.yml"]

permissions:
  contents: read

jobs:
  accept:
    if: github.event_name == 'push' || github.head_ref == 'agent/cave-karst-consolidation-v1-2'
    runs-on: ubuntu-latest
    env:
      USGS_API_KEY: ${{ secrets.USGS_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Require repository secret before network I/O
        shell: bash
        run: |
          if [ -z "$USGS_API_KEY" ]; then echo "USGS_API_KEY repository secret is not configured" >&2; exit 78; fi
          echo "USGS_API_KEY presence confirmed; value remains masked"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install bounded runtime
        run: python -m pip install httpx==0.28.1
      - name: Derive metadata windows and retrieve bounded historical streams
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from collections import Counter
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          from urllib.parse import urlparse
          import httpx
          from tools.rio_camuy_usgs_snapshot import RequestReceipt, normalize_observation, SITE_POLICY

          ROOT="https://api.waterdata.usgs.gov/ogcapi/v0/collections"
          TARGETS=[("USGS-50014800","00045"),("USGS-50014600","00060")]
          OUT=Path(os.environ["RUNNER_TEMP"])/"cave-karst-v12-historical"; OUT.mkdir(parents=True,exist_ok=True)
          def canon(v): return json.dumps(v,sort_keys=True,separators=(",",":"),ensure_ascii=False).encode()
          def h(b): return hashlib.sha256(b).hexdigest()
          def dt(s):
              x=datetime.fromisoformat(str(s).replace("Z","+00:00")); return x if x.tzinfo else x.replace(tzinfo=timezone.utc)
          def iso(x): return x.astimezone(timezone.utc).isoformat().replace("+00:00","Z")
          def receipt(resp):
              u=urlparse(str(resp.request.url)); m={"method":resp.request.method,"path":u.path,"query":sorted((k,v) for k,v in resp.request.url.params.multi_items() if k!="api_key"),"status_code":resp.status_code,"response_sha256":h(resp.content)}; return {**m,"request_receipt_sha256":h(canon(m))}
          def fetch_pages(client,collection,params):
              url=f"{ROOT}/{collection}/items"; p=params; seen=set(); features=[]; receipts=[]
              while url:
                  if url in seen: raise SystemExit(f"pagination loop: {collection}")
                  seen.add(url); r=client.get(url,params=p); receipts.append(receipt(r))
                  if r.status_code!=200: raise SystemExit(f"{collection} HTTP {r.status_code}")
                  doc=r.json()
                  if not isinstance(doc,dict) or not isinstance(doc.get("features"),list): raise SystemExit(f"{collection} schema drift")
                  features.extend(x for x in doc["features"] if isinstance(x,dict)); url=next((x.get("href") for x in doc.get("links",[]) if isinstance(x,dict) and x.get("rel")=="next"),None); p=None
              return features,receipts
          def chunks(begin,end):
              cur=begin
              while cur<=end:
                  stop=min(cur+timedelta(days=730),end); yield cur,stop
                  if stop>=end: break
                  cur=stop+timedelta(seconds=1)

          headers={"X-Api-Key":os.environ["USGS_API_KEY"],"Accept":"application/geo+json, application/json"}
          result={"schema_version":"aguayluz.cave-karst-v12-bounded-historical-acceptance/v1","targets":{},"invariants":{}}
          with httpx.Client(headers=headers,timeout=120,follow_redirects=True) as client:
              for site,pcode in TARGETS:
                  meta,mrec=fetch_pages(client,"time-series-metadata",{"monitoring_location_id":site,"limit":10000,"f":"json"}); matched=[]
                  for f in meta:
                      p=f.get("properties") or {}; tsid=p.get("id") or f.get("id")
                      if p.get("monitoring_location_id")!=site or str(p.get("parameter_code"))!=pcode: continue
                      if p.get("computation_period_identifier")!="Points": continue
                      if not p.get("begin_utc") or not p.get("end_utc") or not tsid: continue
                      matched.append({**p,"_time_series_id":str(tsid)})
                  if not matched: raise SystemExit(f"no point-series metadata period for {site}:{pcode}")
                  series_receipts=[]; observations={}; series_windows=[]
                  for p in matched:
                      tsid=p["_time_series_id"]; begin,end=dt(p["begin_utc"]),dt(p["end_utc"])
                      if end<begin: raise SystemExit("metadata period inverted")
                      series_windows.append({"begin_utc":iso(begin),"end_utc":iso(end),"computation_identifier":p.get("computation_identifier"),"time_series_id_sha256":h(tsid.encode())})
                      for a,b in chunks(begin,end):
                          rows,recs=fetch_pages(client,"continuous",{"time_series_id":tsid,"datetime":f"{iso(a)}/{iso(b)}","limit":10000,"f":"json"}); series_receipts.extend(recs)
                          for f in rows:
                              props=f.get("properties") or {}
                              if props.get("monitoring_location_id")!=site or str(props.get("parameter_code"))!=pcode: raise SystemExit(f"out-of-scope historical row {site}:{pcode}")
                              if str(props.get("time_series_id"))!=tsid: raise SystemExit("time-series identity drift")
                              t=props.get("time")
                              if not t or not (begin<=dt(t)<=end): raise SystemExit("observation outside metadata period")
                              observations[str(f.get("id") or h(canon(f)))]=f
                  if not observations: raise SystemExit(f"bounded historical stream empty {site}:{pcode}")
                  times=[]; approvals=Counter(); qualifiers=Counter(); normalizable=0; dummy=RequestReceipt("https://api.waterdata.usgs.gov/ogcapi/v0/collections/continuous/items",200,"2000-01-01T00:00:00Z","0"*64,"1"*64)
                  for f in observations.values():
                      p=f.get("properties") or {}; times.append(dt(p["time"])); approvals[str(p.get("approval_status"))]+=1; qualifiers[str(p.get("qualifier"))]+=1; row=normalize_observation(f,dummy,collection="continuous",now=datetime.now(timezone.utc))
                      if row is not None:
                          normalizable+=1
                          if row.get("operational_admission") is not False: raise SystemExit("historical row admitted operationally")
                  result["targets"][f"{site}:{pcode}"]={"metadata_series_count":len(matched),"metadata_windows":series_windows,"metadata_page_count":len(mrec),"continuous_page_count":len(series_receipts),"row_count":len(observations),"normalizable_row_count":normalizable,"observed_min_utc":iso(min(times)),"observed_max_utc":iso(max(times)),"metadata_request_receipts":mrec,"continuous_request_receipts":series_receipts,"approval_status_counts":dict(approvals),"qualifier_counts":dict(qualifiers),"operational_admission":False}

          if SITE_POLICY["50014800"]["current"]!={"00060","00065","72365"}: raise SystemExit("current policy changed")
          if "00045" not in SITE_POLICY["50014800"]["historical"] or SITE_POLICY["50014600"]["current"]: raise SystemExit("historical policy changed")
          park=None
          for line in Path("data/cave_karst_assets.jsonl").read_text().splitlines():
              if line.strip():
                  x=json.loads(line)
                  if x.get("asset_id")=="AYL_KARST_CAMUY_PARK": park=x
          if not park or (park.get("operational") or {}).get("status")!="closed": raise SystemExit("Camuy park no longer closed")
          public=json.loads(Path("data/rio_camuy_monitoring_public_v0_1.json").read_text()); blob=json.dumps(public,sort_keys=True)
          if (public.get("restricted_contracts") or {}).get("commissioned_sensor_count")!=0: raise SystemExit("commissioned sensor count changed")
          if (public.get("threshold_policy") or {}).get("stage_rain_authority")!="pilot_provisional": raise SystemExit("threshold authority changed")
          if public.get("public_notifications_enabled") is not False or public.get("automatic_public_reopening_enabled") is not False: raise SystemExit("notification/reopen policy changed")
          if (public.get("current_interpretation") or {}).get("camuy_public_access_state")!="closed": raise SystemExit("public Camuy state changed")
          if (public.get("current_interpretation") or {}).get("historical_50014600_can_be_promoted_to_current") is not False: raise SystemExit("historical upstream promotion policy changed")
          for forbidden in ("sensor_id","monitoring_site_id","emergency_geometry","evacuation_route","muster_point"):
              if f'"{forbidden}"' in blob: raise SystemExit(f"forbidden public field: {forbidden}")
          result["invariants"]={"current_admission_policy":["USGS-50014800:00060","USGS-50014800:00065","USGS-50014800:72365"],"camuy_park_status":"closed","local_sensor_commissioned_count":0,"stage_rain_thresholds_authority":"pilot_provisional","public_notifications_enabled":False,"automatic_public_reopening_enabled":False,"historical_rows_operational_admission":False,"historical_50014600_can_be_promoted_to_current":False,"credential_persisted":False,"raw_payload_uploaded":False,"p2_p3_or_emergency_leakage":False}
          redacted=OUT/"cave-karst-v12-bounded-historical-redacted.json"; redacted.write_text(json.dumps(result,indent=2,sort_keys=True)+"\n")
          print(json.dumps({k:{"windows":v["metadata_windows"],"rows":v["row_count"],"pages":v["continuous_page_count"],"min":v["observed_min_utc"],"max":v["observed_max_utc"]} for k,v in result["targets"].items()},sort_keys=True)); print("receipt_sha256="+h(redacted.read_bytes()))
          PY
      - name: Upload redacted historical receipt only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cave-karst-v12-bounded-historical-redacted
          path: ${{ runner.temp }}/cave-karst-v12-historical/cave-karst-v12-bounded-historical-redacted.json
          if-no-files-found: error
          retention-days: 7
