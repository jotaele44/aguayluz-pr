name: Drought operations live source gate

on:
  workflow_dispatch:
  push:
    branches:
      - feature/drought-operations-page-v0-1
    paths:
      - scripts/ingest_drought_usdm_footprint.py
      - server/backend/drought_ops_api.py
      - tests/test_ingest_drought_usdm_footprint.py
      - tests/test_drought_ops_api.py
      - .github/workflows/drought-operations-live.yml

permissions:
  contents: read

jobs:
  live-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Fetch shared federation packages (thehub-pr sibling)
        run: |
          git clone --depth 1 https://github.com/jotaele44/thehub-pr.git ../thehub-pr

      - name: Install test dependencies
        run: python -m pip install uv && uv pip install --system -e ".[dev]"

      - name: Focused contract tests
        run: pytest -q tests/test_ingest_drought_usdm_footprint.py tests/test_drought_ops_api.py

      - name: Acquire official current USDM footprint
        run: >-
          python scripts/ingest_drought_usdm_footprint.py
          --out artifacts/drought_usdm_footprint.json
          --weeks 12

      - name: Verify live artifact contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("artifacts/drought_usdm_footprint.json")
          doc = json.loads(path.read_text())
          assert doc["schema_version"] == "aguayluz.usdm-drought-operations/v0.1"
          assert doc["map_date"]
          assert doc["statistics"]["semantics"] == "cumulative_percent_area_at_or_above_category"
          assert doc["footprint"]["type"] == "FeatureCollection"
          assert doc["footprint"]["features"]
          assert all(f["properties"]["category"] in {"D0", "D1", "D2", "D3", "D4"} for f in doc["footprint"]["features"])
          assert all(f["properties"]["derived"] is False for f in doc["footprint"]["features"])
          for source in doc["source_manifestations"].values():
              assert len(source["sha256"]) == 64
              assert source["byte_count"] > 0
          print(json.dumps({
              "map_date": doc["map_date"],
              "features": len(doc["footprint"]["features"]),
              "statistics": {k: doc["statistics"][k] for k in ["D0", "D1", "D2", "D3", "D4"]},
              "geometry_sha256": doc["source_manifestations"]["geometry"]["sha256"],
              "statistics_sha256": doc["source_manifestations"]["statistics"]["sha256"],
          }, sort_keys=True))
          PY

      - name: Upload provenance-bound PR extract
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: drought-usdm-footprint-${{ github.sha }}
          path: artifacts/drought_usdm_footprint.json
          if-no-files-found: error
          retention-days: 30
