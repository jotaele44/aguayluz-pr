name: maintenance

# Audit-first maintenance for aguayluz-pr. Runs the maintenance tests and the
# audit-mode CLI, uploads the report as an artifact, and never auto-commits.

on:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * 1"   # Mondays 06:23 UTC

# Least privilege: this workflow only reads the repo (and uploads artifacts,
# which uses the runtime token, not GITHUB_TOKEN). Widen deliberately if a
# step ever needs to write back.
permissions:
  contents: read

jobs:
  maintenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Fetch shared federation packages (thehub-pr sibling)
        run: |
          ref="${{ github.head_ref || github.ref_name }}"
          git clone --depth 1 --branch "$ref" https://github.com/jotaele44/thehub-pr.git ../thehub-pr \
            || git clone --depth 1 https://github.com/jotaele44/thehub-pr.git ../thehub-pr
      - name: Install uv
        run: python -m pip install uv
      - name: Install
        run: uv pip install --system -e .[dev]
      - name: Maintenance tests
        run: pytest -q tests/test_adapter_local.py tests/test_maintenance_wiring.py
      - name: Audit run
        run: aguayluz maintenance --mode audit --json
      - name: Upload maintenance report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aguayluz-maintenance-report
          path: reports/maintenance/latest.json
          if-no-files-found: ignore
