name: maintenance

# Audit-first maintenance for aguayluz-pr. Runs the maintenance tests and the
# audit-mode CLI, uploads the report as an artifact, and never auto-commits.

on:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * 1"   # Mondays 06:23 UTC

# Least privilege: this workflow only reads the repo (and uploads artifacts,
# which uses the runtime token, not GITHUB_TOKEN). Widen deliberately if a
# step ever needs to write back.
permissions:
  contents: read

# Serialise runs on the same ref without cancelling. This workflow can
# publish, write data, or hand off to another repo, and killing it
# mid-flight risks leaving that work half-done.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  maintenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Assert isolated checkout
        run: test ! -e "$GITHUB_WORKSPACE/../thehub-pr"
      - name: Install uv
        run: python -m pip install uv
      - name: Install
        run: |
          uv pip install --system -e .[dev]
          test ! -e "$GITHUB_WORKSPACE/../thehub-pr"
      - name: Maintenance tests
        run: pytest -q tests/test_adapter_local.py tests/test_maintenance_wiring.py
      - name: Audit run
        run: aguayluz maintenance --mode audit --json
      - name: Upload maintenance report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aguayluz-maintenance-report
          path: reports/maintenance/latest.json
          if-no-files-found: ignore
