name: geo-boundary-validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-pr-municipios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install GIS validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "geopandas>=1.0" "shapely>=2.1" "pytest>=8" "ruff>=0.5"
      - name: Lint GIS gate
        run: ruff check scripts/validate_pr_geo_boundaries.py tests/test_pr_geo_validation.py
      - name: Focused GIS regressions
        run: pytest -q tests/test_pr_geo_validation.py
      - name: Validate committed 78-municipio layer
        run: |
          python scripts/validate_pr_geo_boundaries.py \
            data/geo/pr_municipios.geojson \
            --registry data/geo/pr_municipios.json \
            --output-class authoritative \
            --report outputs/pr_geo_validation.json
      - name: Compile validator
        run: python -m py_compile scripts/validate_pr_geo_boundaries.py
