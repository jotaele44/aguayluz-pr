name: PREB Reliability Docket Live Smoke

on:
  pull_request:
    branches: ["main"]
    paths:
      - "scripts/ingest_preb_reliability_docket.py"
      - "tests/test_ingest_preb_reliability_docket.py"
      - ".github/workflows/preb-reliability-live-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Index live PREB docket
        run: |
          python scripts/ingest_preb_reliability_docket.py             --out /tmp/preb_reliability_docket.jsonl             --summary-out /tmp/preb_reliability_docket_summary.json

      - name: Assert live denominator closure
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          summary = json.loads(
              Path("/tmp/preb_reliability_docket_summary.json").read_text(encoding="utf-8")
          )
          assert summary["certification_state"] == "PASS", summary
          assert summary["advertised_document_count"] == summary["parsed_document_count"], summary
          assert summary["parsed_document_count"] > 0, summary
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Upload PREB live-smoke evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: preb-reliability-live-smoke
          path: /tmp/preb_reliability_docket_summary.json
          if-no-files-found: error
