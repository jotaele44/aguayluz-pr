name: Salud SDWIS Authoritative Source Freeze

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/acquire_salud_sdwis_water_sources.py"
      - "scripts/ingest_salud_sdwis_water.py"
      - "src/aguayluz/hazard_adapters/sdwa_drinking_water.py"
      - ".federation/gui-capabilities.json"
      - "config/hazard_advisory_sources.v1.json"
      - "tests/test_acquire_salud_sdwis_water_sources.py"
      - "tests/test_hazard_adapter_sdwa_drinking_water.py"
      - "tests/test_ingest_salud_sdwis_water.py"
      - ".github/workflows/hazard-salud-sdwis-source-freeze.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: salud-sdwis-source-freeze-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install bounded acquisition runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" pypdf

      - name: Run source-freeze contract tests
        run: |
          pytest -q             tests/test_acquire_salud_sdwis_water_sources.py             tests/test_hazard_adapter_sdwa_drinking_water.py             tests/test_ingest_salud_sdwis_water.py

      - name: Acquire authoritative Salud and EPA bytes
        run: |
          python scripts/acquire_salud_sdwis_water_sources.py             --output-root artifacts/salud_sdwis_acquired

      - name: Print bounded source signals
        shell: python
        run: |
          import json
          from pathlib import Path

          path = Path("artifacts/salud_sdwis_acquired/source_acquisition_receipt.json")
          receipt = json.loads(path.read_text(encoding="utf-8"))
          print("SOURCE_ARITHMETIC", json.dumps(receipt["source_arithmetic"], sort_keys=True))
          for row in receipt["salud_sources"]:
              inv = row["pdf_inventory"]
              print(
                  "SALUD_SOURCE",
                  row["source_record_id"],
                  "sha256=" + row["byte_sha256"],
                  "bytes=" + str(row["byte_length"]),
                  "pages=" + str(inv["page_count"]),
                  "pwsids=" + str(inv["distinct_pwsid_count"]),
                  "pwsid_occurrences=" + str(inv["pwsid_occurrences"]),
              )
              for signal in inv["pwsid_signal_lines"][:30]:
                  print(
                      "PWSID_SIGNAL",
                      row["source_record_id"],
                      f"p{signal['page']}",
                      json.dumps(signal["text"], ensure_ascii=False),
                  )
          epa = receipt["epa_sdwa_archive"]
          print(
              "EPA_ARCHIVE",
              "sha256=" + epa["byte_sha256"],
              "bytes=" + str(epa["byte_length"]),
              "members=" + str(epa["zip_member_count"]),
          )
          print("EPA_MEMBER", json.dumps(epa["selected_member"], sort_keys=True))

      - name: Reconcile complete SDWIS member into 2025 PR denominator
        shell: python
        run: |
          import json
          import subprocess
          import sys
          from pathlib import Path

          acquired = Path("artifacts/salud_sdwis_acquired")
          receipt = json.loads(
              (acquired / "source_acquisition_receipt.json").read_text(encoding="utf-8")
          )
          epa = receipt["epa_sdwa_archive"]
          member = epa["selected_member"]
          cmd = [
              sys.executable,
              "scripts/ingest_salud_sdwis_water.py",
              "--year", "2025",
              "--output-root", "artifacts/salud_sdwis_reconciled",
              "--salud-public-notice", str(acquired / "raw" / "salud_10746.pdf"),
              "--salud-report", str(acquired / "raw" / "salud_10747.pdf"),
              "--salud-annex", str(acquired / "raw" / "salud_10748.pdf"),
              "--sdwis-violations",
              str(acquired / "extracted" / "SDWA_VIOLATIONS_ENFORCEMENT.csv"),
              "--sdwis-source-url",
              "https://echo.epa.gov/files/echodownloads/SDWA_latest_downloads.zip",
              "--sdwis-parent-archive-sha256", epa["byte_sha256"],
              "--sdwis-archive-member", member["archive_member"],
          ]
          subprocess.run(cmd, check=True)

      - name: Validate reconciliation receipt
        shell: python
        run: |
          import json
          from pathlib import Path

          acquired = json.loads(
              Path(
                  "artifacts/salud_sdwis_acquired/source_acquisition_receipt.json"
              ).read_text(encoding="utf-8")
          )
          receipt = json.loads(
              Path(
                  "artifacts/salud_sdwis_reconciled/salud_sdwis_water_receipt.json"
              ).read_text(encoding="utf-8")
          )
          assert acquired["source_arithmetic"]["state"] == "PASS", acquired
          assert acquired["source_arithmetic"]["acquired_sources"] == 4, acquired
          assert receipt["salud_artifact_arithmetic"]["state"] == "PASS", receipt
          assert receipt["salud_artifact_arithmetic"]["frozen"] == 3, receipt
          assert receipt["sdwis_source_arithmetic"]["state"] == "PASS", receipt
          details = receipt["sdwis_details"]
          assert details["snapshot_accounting"]["collapse_conflict_source_rows"] == 0, details
          assert details["provenance"]["parent_archive_sha256"] == (
              acquired["epa_sdwa_archive"]["byte_sha256"]
          )
          assert details["provenance"]["member_sha256"] == (
              acquired["epa_sdwa_archive"]["selected_member"]["member_sha256"]
          )
          print("SDWIS_SOURCE_ARITHMETIC", json.dumps(
              receipt["sdwis_source_arithmetic"], sort_keys=True
          ))
          print("SDWIS_SNAPSHOT_ACCOUNTING", json.dumps(
              details["snapshot_accounting"], sort_keys=True
          ))
          print("SDWIS_REASON_COUNTS", json.dumps(
              receipt["sdwis_classification_reason_counts"], sort_keys=True
          ))
          print("CERTIFICATION_STATE", receipt["certification_state"])
          for sample in receipt["sdwis_classifications"][:50]:
              print("CLASSIFICATION_SAMPLE", json.dumps(sample, sort_keys=True))

      - name: Upload compact receipts and extracted indexes
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: salud-sdwis-source-receipts
          path: |
            artifacts/salud_sdwis_acquired/source_acquisition_receipt.json
            artifacts/salud_sdwis_acquired/pdf_pages
            artifacts/salud_sdwis_reconciled/salud_sdwis_water_receipt.json
            artifacts/salud_sdwis_reconciled/hazard_manifestations.jsonl
            artifacts/salud_sdwis_reconciled/hazard_records.jsonl
            artifacts/salud_sdwis_reconciled/hazard_source_accounting.jsonl
          if-no-files-found: error
          retention-days: 90

      - name: Upload authoritative raw manifestations
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: salud-sdwis-authoritative-raw
          path: |
            artifacts/salud_sdwis_acquired/raw
            artifacts/salud_sdwis_acquired/extracted/SDWA_VIOLATIONS_ENFORCEMENT.csv
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
