name: PFAS Evidence Freeze

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  freeze-ucmr5-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Download exact EPA UCMR5 state archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/pfas_ucmr5/raw artifacts/pfas_ucmr5/derived
          url='https://www.epa.gov/system/files/other-files/2023-08/ucmr5-occurrence-data-by-state.zip'
          expected_archive_sha='4845eb3abf34d61d7d239e26a815c69b21e39d249840243d266274b5b5d73aaa'
          curl --fail --location --proto '=https' --tlsv1.2 \
            --retry 3 --retry-all-errors \
            --output artifacts/pfas_ucmr5/raw/ucmr5-occurrence-data-by-state.zip \
            "$url"
          test -s artifacts/pfas_ucmr5/raw/ucmr5-occurrence-data-by-state.zip
          file artifacts/pfas_ucmr5/raw/ucmr5-occurrence-data-by-state.zip
          unzip -t artifacts/pfas_ucmr5/raw/ucmr5-occurrence-data-by-state.zip
          sha256sum artifacts/pfas_ucmr5/raw/ucmr5-occurrence-data-by-state.zip \
            > artifacts/pfas_ucmr5/raw/ucmr5-occurrence-data-by-state.zip.sha256
          actual_archive_sha="$(cut -d' ' -f1 artifacts/pfas_ucmr5/raw/ucmr5-occurrence-data-by-state.zip.sha256)"
          test "$actual_archive_sha" = "$expected_archive_sha" || {
            echo "EPA UCMR5 archive manifestation drift: $actual_archive_sha" >&2
            exit 1
          }
          unzip -Z1 artifacts/pfas_ucmr5/raw/ucmr5-occurrence-data-by-state.zip \
            > artifacts/pfas_ucmr5/raw/archive-members.txt

      - name: Extract Puerto Rico denominator and provenance
        shell: python
        run: |
          import csv
          import hashlib
          import json
          import pathlib
          import zipfile
          from collections import Counter
          from datetime import datetime, timezone

          root = pathlib.Path('artifacts/pfas_ucmr5')
          archive = root / 'raw' / 'ucmr5-occurrence-data-by-state.zip'
          derived = root / 'derived'
          url = 'https://www.epa.gov/system/files/other-files/2023-08/ucmr5-occurrence-data-by-state.zip'
          expected_member_sha = '4d72703e4fece5d5fb7b243c1bcd5a72e65c09bf79efbbc05b548c9fb19e7391'
          expected_derived_sha = 'ac40d8d67f7343832e0b11d78c892e3a6cdd44fe4d0b0892407347d4400b80c5'

          def sha256_bytes(payload: bytes) -> str:
              return hashlib.sha256(payload).hexdigest()

          with zipfile.ZipFile(archive) as zf:
              members = zf.namelist()
              candidates = [
                  name for name in members
                  if name.lower().endswith('.txt')
                  and ('ma_wy' in name.lower() or 'ma-wy' in name.lower())
              ]
              if len(candidates) != 1:
                  raise SystemExit(f'expected exactly one M-W state member; found {candidates}')
              member = candidates[0]
              payload = zf.read(member)

          member_sha = sha256_bytes(payload)
          if member_sha != expected_member_sha:
              raise SystemExit(f'UCMR5 M-W member manifestation drift: {member_sha}')

          selected_encoding = None
          for encoding in ('utf-8-sig', 'cp1252'):
              try:
                  text = payload.decode(encoding)
                  selected_encoding = encoding
                  break
              except UnicodeDecodeError:
                  continue
          if selected_encoding is None:
              raise SystemExit('authoritative UCMR5 member is not valid UTF-8 or CP1252')

          reader = csv.DictReader(text.splitlines(), delimiter='\t')
          if reader.fieldnames is None:
              raise SystemExit('UCMR5 state member has no header')
          headers = list(reader.fieldnames)
          pws_field = next((h for h in headers if h.lower().replace(' ', '') == 'pwsid'), None)
          if pws_field is None:
              raise SystemExit(f'PWSID field not found in {headers}')

          rows = [row for row in reader if str(row.get(pws_field) or '').upper().startswith('PR')]
          if len(rows) != 21771:
              raise SystemExit(f'Puerto Rico row-count drift: {len(rows)} != 21771')

          out_tsv = derived / 'ucmr5_pr.tsv'
          with out_tsv.open('w', encoding='utf-8', newline='') as handle:
              writer = csv.DictWriter(handle, fieldnames=headers, delimiter='\t', lineterminator='\n')
              writer.writeheader()
              writer.writerows(rows)

          derived_sha = sha256_bytes(out_tsv.read_bytes())
          if derived_sha != expected_derived_sha:
              raise SystemExit(f'Puerto Rico derived TSV drift: {derived_sha}')

          contaminant_field = next((h for h in headers if h.lower() == 'contaminant'), None)
          sign_field = next((h for h in headers if h.lower() == 'analyticalresultssign'), None)
          pws_ids = sorted({str(row[pws_field]) for row in rows})
          if len(pws_ids) != 99:
              raise SystemExit(f'Puerto Rico PWS cardinality drift: {len(pws_ids)} != 99')
          contaminants = Counter(str(row.get(contaminant_field) or '') for row in rows) if contaminant_field else Counter()
          signs = Counter(str(row.get(sign_field) or '') for row in rows) if sign_field else Counter()

          manifest = {
              'schema_version': 'aguayluz.pfas.ucmr5_freeze/v1',
              'source_url': url,
              'retrieved_utc': datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z'),
              'archive_sha256': sha256_bytes(archive.read_bytes()),
              'archive_size_bytes': archive.stat().st_size,
              'archive_member_count': len(members),
              'selected_member': member,
              'selected_member_encoding': selected_encoding,
              'selected_member_sha256': member_sha,
              'selected_member_size_bytes': len(payload),
              'headers': headers,
              'header_count': len(headers),
              'puerto_rico_row_count': len(rows),
              'puerto_rico_pws_count': len(pws_ids),
              'puerto_rico_pws_ids': pws_ids,
              'contaminant_counts': dict(sorted(contaminants.items())),
              'analytical_result_sign_counts': dict(sorted(signs.items())),
              'derived_tsv_sha256': derived_sha,
              'selection_rule': 'PWSID starts with PR',
              'semantic_guard': 'UCMR occurrence results are not compliance determinations.',
          }
          (derived / 'ucmr5_pr_manifest.json').write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps({
              'selected_member': member,
              'selected_member_encoding': selected_encoding,
              'puerto_rico_row_count': len(rows),
              'puerto_rico_pws_count': len(pws_ids),
              'archive_sha256': manifest['archive_sha256'],
              'derived_tsv_sha256': manifest['derived_tsv_sha256'],
          }, indent=2, sort_keys=True))

      - name: Upload frozen EPA evidence bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pfas-ucmr5-pr-evidence
          path: artifacts/pfas_ucmr5
          if-no-files-found: error
          retention-days: 90

      - name: Materialize complete Puerto Rico denominator on source branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          set -euo pipefail
          cp artifacts/pfas_ucmr5/derived/ucmr5_pr.tsv data/pfas_ucmr5_pr.tsv
          actual="$(sha256sum data/pfas_ucmr5_pr.tsv | cut -d' ' -f1)"
          test "$actual" = 'ac40d8d67f7343832e0b11d78c892e3a6cdd44fe4d0b0892407347d4400b80c5'
          git add -f data/pfas_ucmr5_pr.tsv
          if git diff --cached --quiet; then
            echo 'Canonical UCMR5 Puerto Rico denominator already materialized.'
            exit 0
          fi
          git config user.name 'aguayluz-bot'
          git config user.email 'noreply@github.com'
          git commit -m 'data(pfas): materialize final UCMR5 Puerto Rico denominator'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
