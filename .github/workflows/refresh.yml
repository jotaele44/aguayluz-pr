name: refresh

on:
  schedule:
    - cron: "*/15 * * * *"  # every 15 min — near-real-time hazard feeds (NWS + quakes)
    - cron: "0 7 * * *"    # daily 07:00 UTC — NWS alerts + USGS levels
    - cron: "0 7 * * 1"    # Monday 07:00 UTC — full weekly refresh
  workflow_dispatch:
    inputs:
      cadence:
        description: "Refresh cadence: fast | daily | weekly | all"
        required: false
        default: "weekly"

permissions:
  contents: write   # allow the job to commit updated data files

# Serialise runs on the same ref without cancelling. This workflow can
# publish, write data, or hand off to another repo, and killing it
# mid-flight risks leaving that work half-done.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # No explicit limit previously meant GitHub's 360-minute default, and
    # `cancel-in-progress: false` above means a single hung run can back up
    # the 15-minute fast-cadence queue for hours. 45 min comfortably covers
    # the heaviest `--all` cadence (~50 sources, each with its own 60-180s
    # per-request timeout) while bounding the worst case far below 360.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Assert isolated checkout
        run: test ! -e "$GITHUB_WORKSPACE/../thehub-pr"

      - name: Install uv
        run: python -m pip install uv

      - name: Install dependencies
        run: |
          uv pip install --system -e ".[dev]"
          test ! -e "$GITHUB_WORKSPACE/../thehub-pr"

      - name: Fast refresh (near-real-time hazard feeds — NWS + quakes + LUMA outages)
        if: >
          (github.event_name == 'schedule' && github.event.schedule == '*/15 * * * *') ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.cadence == 'fast')
        run: python scripts/refresh.py --fast

      - name: Daily refresh (NWS alerts + USGS levels)
        if: >
          github.event_name == 'schedule' &&
          github.event.schedule == '0 7 * * *'
        run: python scripts/refresh.py --daily

      - name: Weekly refresh (full corpus)
        if: >
          (github.event_name == 'schedule' && github.event.schedule == '0 7 * * 1') ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.cadence == 'weekly')
        # No credentials are configured: STEP_OSHA is a best-effort no-op and
        # STEP_NEON_PRODUCTS skips and exits 0 (NEON's /api/v0/data returns 403
        # without a token). NEON availability tracking (STEP_NEON) needs none.
        run: python scripts/refresh.py --weekly

      - name: Full refresh (includes optional MiLUMA)
        if: >
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.cadence == 'all'
        run: python scripts/refresh.py --all

      - name: Commit updated data
        id: commit
        run: |
          git config user.name  "aguayluz-bot"
          git config user.email "noreply@github.com"
          git add data/ outputs/ reports/
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: scheduled refresh $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # No push-style hand-offs: this repo stores no tokens. The commit above is the
      # hand-off. Floot and thehub-pr pull `main` on their own schedule.
