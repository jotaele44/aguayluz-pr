name: Source Product Denominator Certification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify-source-product-denominators:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Acquire bounded LUMA and EIA publication evidence
        run: python scripts/certify_source_product_denominators.py --output artifacts/source-product-denominators

      - name: Upload immutable denominator evidence bundle
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: source-product-denominator-evidence
          path: artifacts/source-product-denominators
          if-no-files-found: error
          retention-days: 90
