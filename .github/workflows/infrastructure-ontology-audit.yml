name: Infrastructure ontology audit

on:
  pull_request:
    paths:
      - "ontology/**"
      - "schemas/infrastructure_*.schema.json"
      - "tests/test_infrastructure_*.py"
      - "tests/test_ebas_*.py"
      - "tests/fixtures/ebas_vertical_slice.json"
      - ".github/workflows/infrastructure-ontology-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ontology-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact audit head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest jsonschema

      - name: Run ontology regression tests
        run: |
          python -m pytest -q \
            tests/test_infrastructure_ontology.py \
            tests/test_infrastructure_source_aware.py \
            tests/test_infrastructure_source_assertions.py \
            tests/test_infrastructure_recovered_hydro.py \
            tests/test_infrastructure_residual_219.py \
            tests/test_ebas_vertical_slice.py \
            tests/test_ebas_source_universe.py \
            tests/test_infrastructure_v7_v10.py \
            tests/test_infrastructure_sidecar_invariants.py

      - name: Generate frozen baseline vocabulary audit
        run: |
          mkdir -p reports
          python ontology/tools/audit_infrastructure_vocabulary.py \
            --assets data/utility_assets.jsonl \
            --registry ontology/infrastructure_terms.v0.1.json \
            --report reports/infrastructure_vocabulary_audit.json \
            --decisions reports/infrastructure_classification_decisions.jsonl

      - name: Generate source-aware overlay audit
        run: |
          python ontology/tools/audit_infrastructure_source_aware.py \
            --assets data/utility_assets.jsonl \
            --registry ontology/infrastructure_terms.v0.1.json \
            --overlay ontology/source_aware_crosswalk.v0.1.json \
            --report reports/infrastructure_source_aware_audit.json \
            --decisions reports/infrastructure_source_aware_decisions.jsonl

      - name: Generate recovered-source ledger replay audit
        run: |
          python ontology/tools/audit_infrastructure_recovered_replay.py \
            --source-aware-decisions reports/infrastructure_source_aware_decisions.jsonl \
            --report reports/infrastructure_recovered_replay_audit.json \
            --decisions reports/infrastructure_recovered_replay_decisions.jsonl

      - name: Adjudicate frozen residual 219 universe
        run: |
          python ontology/tools/audit_infrastructure_residual_219.py \
            --replay-decisions reports/infrastructure_recovered_replay_decisions.jsonl \
            --report reports/infrastructure_residual_219_audit.json \
            --decisions reports/infrastructure_final_8475_decisions.jsonl

      - name: Audit EBAS source universe and manifestations
        run: |
          python ontology/tools/audit_ebas_manifestations.py \
            --seed ontology/ebas_manifestation_seed.v0.1.json \
            --registry ontology/ebas_source_registry.v0.1.json \
            --report reports/ebas_source_universe_audit.json \
            --manifestations reports/ebas_manifestations.jsonl

      - name: Freeze audit artifact hashes
        run: |
          sha256sum \
            ontology/infrastructure_terms.v0.1.json \
            ontology/infrastructure_residual_terms.v0.1.json \
            ontology/source_aware_crosswalk.v0.1.json \
            ontology/recovered_hydro_sources.v0.1.json \
            ontology/ebas_source_registry.v0.1.json \
            ontology/ebas_manifestation_seed.v0.1.json \
            ontology/legacy_projection_rules.v0.1.json \
            schemas/infrastructure_classification.schema.json \
            schemas/infrastructure_source_assertion.schema.json \
            schemas/infrastructure_source_replay_decision.schema.json \
            schemas/infrastructure_object.schema.json \
            schemas/infrastructure_relation.schema.json \
            schemas/infrastructure_geometry.schema.json \
            schemas/infrastructure_lifecycle_event.schema.json \
            schemas/infrastructure_measurement.schema.json \
            schemas/infrastructure_entity_role.schema.json \
            schemas/infrastructure_legacy_projection.schema.json \
            data/utility_assets.jsonl \
            reports/infrastructure_vocabulary_audit.json \
            reports/infrastructure_classification_decisions.jsonl \
            reports/infrastructure_source_aware_audit.json \
            reports/infrastructure_source_aware_decisions.jsonl \
            reports/infrastructure_recovered_replay_audit.json \
            reports/infrastructure_recovered_replay_decisions.jsonl \
            reports/infrastructure_residual_219_audit.json \
            reports/infrastructure_final_8475_decisions.jsonl \
            reports/ebas_source_universe_audit.json \
            reports/ebas_manifestations.jsonl \
            > reports/infrastructure_ontology_SHA256SUMS.txt

      - name: Assert arithmetic closure and bounded denominator states
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          baseline = json.loads(Path("reports/infrastructure_vocabulary_audit.json").read_text())
          source_aware = json.loads(Path("reports/infrastructure_source_aware_audit.json").read_text())
          recovery = json.loads(Path("ontology/recovered_hydro_sources.v0.1.json").read_text())
          replay = json.loads(Path("reports/infrastructure_recovered_replay_audit.json").read_text())
          residual = json.loads(Path("reports/infrastructure_residual_219_audit.json").read_text())
          ebas = json.loads(Path("reports/ebas_source_universe_audit.json").read_text())
          for report in (baseline, source_aware):
              assert report["arithmetic"]["pass"] is True, report["arithmetic"]
              assert report["arithmetic"]["source_rows"] == report["summary"]["row_count"]
              assert sum(x["count"] for x in report["summary"]["raw_pairs"]) == report["summary"]["row_count"]
              assert report["universal_exhaustion_claimed"] is False
          assert source_aware["arithmetic"]["source_rows"] == baseline["arithmetic"]["source_rows"]
          assert source_aware["arithmetic"]["classified"] > baseline["arithmetic"]["classified"]
          assert source_aware["arithmetic"]["unresolved"] < baseline["arithmetic"]["unresolved"]
          assert source_aware["classification_is_identity"] is False
          assert source_aware["overlay_expected_counts"]["pass"] is True
          projection = recovery["bounded_reclassification_projection"]
          assert projection["primary_classified"] + projection["duplicate_derived_manifestations"] + projection["excluded"] + projection["unresolved"] == projection["starting_source_rows"] == 8475
          assert replay["arithmetic_pass"] is True
          assert replay["source_rows"] == 8475
          assert replay["primary_classified"] == 5058
          assert replay["duplicate_derived_manifestations"] == 3187
          assert replay["excluded"] == 11
          assert replay["unresolved"] == 219
          assert residual["arithmetic_pass"] is True
          assert residual["source_rows"] == 8475
          assert residual["residual_explicit_state_count"] == 219
          assert residual["residual_final_states"] == {"CLASSIFIED_SOURCE_ROW": 196, "EXCLUDED_PARSER_ARTIFACT": 2, "UNRESOLVED": 21}
          assert residual["primary_classified"] == 5254
          assert residual["duplicate_derived_manifestations"] == 3187
          assert residual["excluded"] == 13
          assert residual["unresolved"] == 21
          assert residual["identity_effect"] == "none"
          assert residual["physical_asset_count_claimed"] is False
          assert ebas["manifestation_count"] == 44
          assert ebas["identity_candidate_key_count"] == 42
          assert ebas["candidate_not_identity_count"] == 44
          assert ebas["certified_enumerators"] == 0
          assert ebas["certified_reported_denominator_sources"] == 1
          assert ebas["aaa_bounded_current_denominator"] == "OPEN"
          assert ebas["aaa_bounded_historical_denominator"] == 835
          assert ebas["aaa_bounded_historical_snapshot"] == "2024-06"
          assert ebas["aaa_bounded_historical_state"] == "CERTIFIED_REPORTED_SNAPSHOT"
          assert ebas["aaa_bounded_historical_computed_from_enumerator"] is False
          assert ebas["pr_wide_denominator"] == "OPEN"
          assert ebas["physical_asset_count_claimed"] is False
          print(json.dumps({
              "source_rows": residual["source_rows"],
              "final_primary_classified": residual["primary_classified"],
              "duplicate_derived": residual["duplicate_derived_manifestations"],
              "excluded": residual["excluded"],
              "unresolved": residual["unresolved"],
              "ebas_manifestations": ebas["manifestation_count"],
              "ebas_candidate_keys": ebas["identity_candidate_key_count"],
              "aaa_current_denominator": ebas["aaa_bounded_current_denominator"],
              "aaa_historical_denominator": ebas["aaa_bounded_historical_denominator"],
              "aaa_historical_snapshot": ebas["aaa_bounded_historical_snapshot"],
              "historical_computed_from_enumerator": ebas["aaa_bounded_historical_computed_from_enumerator"],
              "pr_wide_denominator": ebas["pr_wide_denominator"]
          }, sort_keys=True))
          PY

      - name: Upload audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: infrastructure-ontology-audit
          if-no-files-found: error
          retention-days: 30
          path: |
            reports/infrastructure_vocabulary_audit.json
            reports/infrastructure_classification_decisions.jsonl
            reports/infrastructure_source_aware_audit.json
            reports/infrastructure_source_aware_decisions.jsonl
            reports/infrastructure_recovered_replay_audit.json
            reports/infrastructure_recovered_replay_decisions.jsonl
            reports/infrastructure_residual_219_audit.json
            reports/infrastructure_final_8475_decisions.jsonl
            reports/ebas_source_universe_audit.json
            reports/ebas_manifestations.jsonl
            reports/infrastructure_ontology_SHA256SUMS.txt
