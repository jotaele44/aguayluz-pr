name: Refresh isolation lock

on:
  push:
    branches: [codex/remove-mandatory-sibling-coupling-v0-1]
    paths:
      - .github/workflows/refresh-isolation-lock.yml

permissions:
  contents: write

concurrency:
  group: refresh-isolation-lock-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.ref_name }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      - name: Regenerate and commit only uv.lock
        run: |
          test ! -e "$GITHUB_WORKSPACE/../thehub-pr"
          uv lock
          test ! -e "$GITHUB_WORKSPACE/../thehub-pr"
          if git diff --quiet -- uv.lock; then
            echo "uv.lock already canonical"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          test "$(git diff --cached --name-only)" = "uv.lock"
          git commit -m "build: regenerate isolated dependency lock"
          git push origin HEAD:"${GITHUB_REF_NAME}"
