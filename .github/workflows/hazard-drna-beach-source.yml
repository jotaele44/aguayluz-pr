name: DRNA Beach Source Freeze

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/ingest_drna_beach_monitoring.py"
      - "src/aguayluz/hazard_adapters/drna_beach.py"
      - "config/hazard_advisory_sources.v1.json"
      - "tests/test_hazard_adapter_drna_beach.py"
      - "tests/test_ingest_drna_beach_monitoring.py"
      - ".github/workflows/hazard-drna-beach-source.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freeze-2026-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install bounded runtime
        run: python -m pip install "httpx>=0.27" "pydantic>=2"

      - name: Freeze DRNA 2026 beach-monitoring denominator
        env:
          PYTHONPATH: src:.
        run: |
          python scripts/ingest_drna_beach_monitoring.py \
            --year 2026 \
            --output-root artifacts/drna_beach_2026 \
            --require-zero-unresolved

      - name: Validate source receipt
        shell: python
        run: |
          import json
          from pathlib import Path

          path = Path("artifacts/drna_beach_2026/receipt.json")
          receipt = json.loads(path.read_text(encoding="utf-8"))
          arithmetic = receipt["source_arithmetic"]
          assert arithmetic["state"] == "PASS", arithmetic
          assert arithmetic["delta"] == 0, arithmetic
          assert arithmetic["unresolved"] == 0, arithmetic
          assert arithmetic["retained"] > 0, arithmetic
          assert receipt["certification_state"] == "PASS", receipt
          assert receipt["archive_pages_frozen"] > 0, receipt
          assert receipt["manifestations_frozen"] >= receipt["archive_pages_frozen"], receipt
          print(json.dumps({
              "certification_state": receipt["certification_state"],
              "source_arithmetic": arithmetic,
              "archive_pages_frozen": receipt["archive_pages_frozen"],
              "discovered_notice_urls": receipt["discovered_notice_urls"],
              "manifestations_frozen": receipt["manifestations_frozen"],
              "new_record_revisions": receipt["new_record_revisions"],
          }, indent=2, sort_keys=True))

      - name: Upload DRNA source evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: drna-beach-source-freeze-2026
          path: artifacts/drna_beach_2026
          if-no-files-found: error
          retention-days: 90
