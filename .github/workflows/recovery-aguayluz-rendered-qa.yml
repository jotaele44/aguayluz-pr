name: AguaYLuz rendered QA — recovery successor

on:
  workflow_dispatch:
  push:
    branches: [recovery/floot-baseline-2026-09-30]
    paths:
      - ".github/workflows/recovery-aguayluz-rendered-qa.yml"

permissions:
  contents: read

jobs:
  rendered-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - name: Reconstruct exact successor
        shell: bash
        run: |
          set -euo pipefail
          bash .recovery/aguayluz-exact/run_exact.sh
          ROOT="$RUNNER_TEMP/recovered"
cp .recovery/aguayluz-successor-v1/aguaSourceHealth.tsx "$ROOT/helpers/aguaSourceHealth.tsx"
cp .recovery/aguayluz-successor-v1/aguaSourceHealth.spec.tsx "$ROOT/helpers/aguaSourceHealth.spec.tsx"
cp .recovery/aguayluz-successor-v1/aguaWaterMutationGuard.tsx "$ROOT/helpers/aguaWaterMutationGuard.tsx"
cp .recovery/aguayluz-successor-v1/aguaWaterMutationGuard.spec.tsx "$ROOT/helpers/aguaWaterMutationGuard.spec.tsx"
          cd "$RUNNER_TEMP/recovered"
          npx vite build
          NPM_CONFIG_LEGACY_PEER_DEPS=true npm install --save-dev --no-audit --no-fund --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Render desktop and narrow iPhone
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/recovered"
          cd "$ROOT"
          npx vite preview --host 127.0.0.1 --port 4173 > rendered-preview.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
          cat > rendered-qa.mjs <<'EOF'
          import { chromium } from "playwright";
          import fs from "node:fs";
          const targets = [
            { name: "desktop-1440", width: 1440, height: 1000 },
            { name: "iphone-393", width: 393, height: 852 },
            { name: "iphone-430", width: 430, height: 932 },
          ];
          const browser = await chromium.launch({ headless: true });
          const results = [];
          for (const target of targets) {
            const page = await browser.newPage({ viewport: { width: target.width, height: target.height } });
            const consoleErrors = [];
            page.on("console", msg => { if (msg.type() === "error") consoleErrors.push(msg.text()); });
            page.on("pageerror", error => consoleErrors.push(String(error)));
            const response = await page.goto("http://127.0.0.1:4173/", { waitUntil: "networkidle" });
            const metrics = await page.evaluate(() => ({
              bodyTextLength: document.body.innerText.trim().length,
              documentClientWidth: document.documentElement.clientWidth,
              documentScrollWidth: document.documentElement.scrollWidth,
              bodyClientWidth: document.body.clientWidth,
              bodyScrollWidth: document.body.scrollWidth,
            }));
            const horizontalOverflow =
              metrics.documentScrollWidth > metrics.documentClientWidth ||
              metrics.bodyScrollWidth > metrics.bodyClientWidth;
            await page.screenshot({ path: `rendered-${target.name}.png`, fullPage: true });
            results.push({
              ...target,
              status: response?.status() ?? null,
              finalUrl: page.url(),
              bodyTextLength: metrics.bodyTextLength,
              horizontalOverflow,
              metrics,
              consoleErrors,
            });
            await page.close();
          }
          await browser.close();
          fs.writeFileSync("rendered-qa.json", JSON.stringify(results, null, 2));
          const failed = results.some(r => r.status !== 200 || r.bodyTextLength < 50 || r.horizontalOverflow || r.consoleErrors.length);
          if (failed) process.exit(1);
          EOF
          node rendered-qa.mjs | tee rendered-qa.log
          sha256sum rendered-qa.json rendered-desktop-1440.png rendered-iphone-393.png rendered-iphone-430.png > rendered-qa-hashes.txt
      - name: Upload rendered QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aguayluz-recovery-rendered-qa
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/recovered/rendered-qa.json
            ${{ runner.temp }}/recovered/rendered-qa-hashes.txt
            ${{ runner.temp }}/recovered/rendered-desktop-1440.png
            ${{ runner.temp }}/recovered/rendered-iphone-393.png
            ${{ runner.temp }}/recovered/rendered-iphone-430.png
            ${{ runner.temp }}/recovered/rendered-preview.log
